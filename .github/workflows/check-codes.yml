name: Проверка кодов Torchlight

on:
  schedule:
    # 3 раза в час: GitHub при нагрузке выбрасывает часть плановых запусков, так хоть один пройдёт.
    # Повтор безопасен, бот помнит отправленные коды. Минуты не круглые: в :00 и :30 GitHub перегружен.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:  # кнопка "Run workflow" для ручного запуска
    inputs:
      test_failure:
        description: "Тест: уронить запуск, чтобы проверить сообщение о сбое"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [bot.py, .github/workflows/check-codes.yml]

permissions:
  contents: write  # чтобы сохранять seen_codes.json обратно в репозиторий
  actions: read    # чтобы узнать, чем закончился прошлый запуск

concurrency: check-codes

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ALERT_HOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK || secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v7

      - name: Проверить источники и отправить новые коды
        run: |
          if [ "${{ inputs.test_failure }}" = "true" ]; then echo "Тестовое падение"; exit 1; fi
          python3 bot.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_ALERT_WEBHOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK }}  # необязательный, иначе сбои пишутся в канал кодов

      - name: Запомнить отправленные коды
        if: always()  # даже если бот упал после отправки, иначе код придёт с @everyone повторно
        run: |
          if ! git diff --quiet seen_codes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_codes.json
            git commit -m "Состояние бота"
            # Если в это время кто-то залил файлы через сайт, подтягиваем их и пробуем ещё раз.
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && exit 0
              sleep 5
            done
            exit 1
          fi

      - name: Сообщить в Discord, что запуск упал
        if: failure()
        run: |
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow check-codes.yml --limit 2 --json conclusion --jq '.[1].conclusion')
          if [ "$prev" != "failure" ]; then  # пишем один раз, а не каждый час
            curl -s -H "Content-Type: application/json" -d "{\"content\": \"⚠️ Бот кодов: запуск на GitHub упал, новые коды могут не прийти. Подробности: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" "$ALERT_HOOK"
          fi

      - name: Сообщить в Discord, что запуски снова проходят
        if: success()
        run: |
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow check-codes.yml --limit 2 --json conclusion --jq '.[1].conclusion')
          if [ "$prev" = "failure" ]; then
            curl -s -H "Content-Type: application/json" -d "{\"content\": \"✅ Бот кодов: запуски на GitHub снова проходят.\"}" "$ALERT_HOOK"
          fi
