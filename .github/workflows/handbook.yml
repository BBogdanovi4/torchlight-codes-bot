name: "Справочник: обновить список"

on:
  schedule:
    - cron: "23 3 * * 1"  # по понедельникам, список навыков и предметов меняется только с патчами
  workflow_dispatch:
    inputs:
      register_commands:
        description: "Зарегистрировать команды /skill и /item в Discord"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [handbook/build_index.py]

permissions:
  contents: write

concurrency: handbook

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Собрать список навыков и предметов с tlidb
        run: python3 handbook/build_index.py

      - name: Сохранить список
        run: |
          if ! git diff --quiet handbook/index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add handbook/index.json
            git commit -m "Справочник: новый список"
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && exit 0
              sleep 5
            done
            exit 1
          fi

      - name: Зарегистрировать команды в Discord
        if: inputs.register_commands
        run: python3 handbook/register_commands.py
        env:
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
